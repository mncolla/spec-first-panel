services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lebane}:${POSTGRES_PASSWORD:-lebane}@db:5432/${POSTGRES_DB:-lebane}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lebane}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lebanelebane}
      S3_BUCKET: ${S3_BUCKET:-departments}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-admin@lebane.local}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-lebanelebane}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-now}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lebane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lebane}
      POSTGRES_DB: ${POSTGRES_DB:-lebane}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lebane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lebanelebane}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
